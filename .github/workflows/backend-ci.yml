name: Backend API and Database CI

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'routes/**'
      - 'lib/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'server.js'
      - 'routes/**'
      - 'lib/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run backend regression tests
        run: npm test
