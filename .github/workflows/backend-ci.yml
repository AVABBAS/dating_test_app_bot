name: Backend API and Database CI

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'routes/**'
      - 'lib/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'server.js'
      - 'routes/**'
      - 'lib/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dating_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dating_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run backend regression tests
        run: npm test
